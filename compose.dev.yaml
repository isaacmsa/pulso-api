# PostgreSQL local de Pulso, misma versión mayor que Supabase.
# Los roles y las bases salen de docker/postgres-init.sql (solo corre al crear el volumen).
# La contraseña del superusuario es de desarrollo y no es secreta.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '54322:5432'
    volumes:
      - pulso_pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      # -h 127.0.0.1 fuerza TCP: el servidor temporal del arranque solo escucha por socket
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pulso_pgdata:
