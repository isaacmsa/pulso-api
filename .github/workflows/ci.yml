name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://pulso_api:pulso_dev@localhost:54322/pulso_test
      TEST_ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:54322/pulso_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Preparar roles y bases de PostgreSQL
        run: psql "postgres://postgres:postgres@localhost:54322/postgres" -v ON_ERROR_STOP=1 -f docker/postgres-init.sql
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Contrato OpenAPI al día
        run: pnpm openapi:check
      - name: Tipos de Workers al día con wrangler.jsonc
        run: pnpm exec wrangler types --env-file .dev.vars.example --check
