name: deploy

# Staging cuando `ci` pasa en un push a `main` (A-017: las migraciones usan el pooler de sesión de
# Supabase). Despliega exactamente el commit que probó `ci` (`head_sha`), no lo último de `main`.
# Antes de desplegar aplica las migraciones, que solo agregan, para que `wrangler rollback` siga
# funcionando con el código anterior (regla 10). A mano, `workflow_dispatch` despliega la rama elegida.
on:
  workflow_run:
    workflows: [ci]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency: deploy-staging

permissions:
  contents: read

jobs:
  staging:
    # solo un `ci` que terminó bien y que corrió por un push (no por un pull request)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Revisar que staging esté configurado
        id: gate
        run: |
          # el id de Hyperdrive de staging, y solo ese: un comentario con el marcador no cuenta
          # falla cerrado: sin una respuesta exacta no se sabe si staging está listo
          ready=$(node scripts/ci/hyperdrive-ready.mjs staging) || ready=""
          if [ "$ready" != "ready=true" ] && [ "$ready" != "ready=false" ]; then
            echo "::error title=Puerta ilegible::hyperdrive-ready.mjs no devolvió ready=true ni ready=false (devolvió: '$ready'). Se detiene en vez de omitir el deploy en silencio."
            exit 1
          fi
          if [ "$ready" = "ready=false" ]; then
            msg="wrangler.jsonc aún tiene pendiente el id de Hyperdrive de staging (env.staging.hyperdrive). No se migra ni se despliega hasta que Isaac lo ponga."
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::warning title=Deploy omitido::$msg"
            else
              echo "::notice title=Deploy omitido::$msg"
            fi
          fi
          echo "$ready" >> "$GITHUB_OUTPUT"
      - name: Revisar los secretos de GitHub
        if: steps.gate.outputs.ready == 'true'
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          for name in STAGING_DATABASE_URL CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=Faltan secretos::Cargar en Settings > Secrets and variables > Actions:$missing"
            exit 1
          fi
      - uses: pnpm/action-setup@v6
        if: steps.gate.outputs.ready == 'true'
      - uses: actions/setup-node@v7
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.gate.outputs.ready == 'true'
      - name: Aplicar migraciones en staging
        if: steps.gate.outputs.ready == 'true'
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      - name: Desplegar pulso-api-staging
        if: steps.gate.outputs.ready == 'true'
        run: pnpm exec wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Comprobar que staging sirve el contrato del repo
        if: steps.gate.outputs.ready == 'true'
        run: |
          # lo servido tiene que ser, byte a byte, el openapi.json del commit desplegado: así el
          # cliente que genera la app no cambia según de dónde salga el contrato. Un despliegue
          # nuevo puede tardar unos segundos en responder, de ahí los reintentos.
          url="https://pulso-api-staging.isaac-mendozasa.workers.dev/openapi.json"
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 20 "$url" -o served-openapi.json && cmp -s served-openapi.json openapi.json; then
              echo "staging sirve el openapi.json del repo."
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then sleep 5; fi
          done
          echo "::error title=Contrato distinto::$url no es igual al openapi.json del repo. Compara a mano: curl -fsS $url | diff - openapi.json"
          diff served-openapi.json openapi.json | head -40 || true
          exit 1

      - name: Comprobar que TOKEN_SIGNING_KEY está cargado
        if: steps.gate.outputs.ready == 'true'
        run: |
          # un token bien formado pero inválido (43 + "." + 43 caracteres base64url) tiene que dar
          # 401 sin tocar la base; un 500 es que el Worker no tiene TOKEN_SIGNING_KEY.
          base="https://pulso-api-staging.isaac-mendozasa.workers.dev"
          a43=$(printf 'A%.0s' $(seq 1 43))
          code=000
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $a43.$a43" "$base/v1/homes/me/status" || echo 000)
            if [ "$code" = "401" ] || [ "$code" = "500" ]; then break; fi
            if [ "$attempt" -lt 5 ]; then sleep 5; fi
          done
          if [ "$code" != "401" ]; then
            echo "::error title=TOKEN_SIGNING_KEY sin cargar o Worker caído::$base/v1/homes/me/status con un token inválido respondió $code en vez de 401. Un 500 indica que falta el secreto: pnpm exec wrangler secret put TOKEN_SIGNING_KEY --env staging"
            exit 1
          fi
          echo "El Worker rechaza un token inválido con 401: TOKEN_SIGNING_KEY está cargado."
