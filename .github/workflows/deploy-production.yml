name: deploy-production

# Producción se despliega solo a mano (A-029): un deploy es una decisión, no el efecto de un push.
# El job usa el Environment `production`, que lleva a Isaac como revisor obligatorio: el job espera
# su aprobación antes de arrancar y antes de que se lea cualquier secreto del Environment.
# Solo acepta un commit que sea de `main` y en el que `ci` haya terminado en verde. Aplica las
# migraciones (solo agregan, regla 10) y después despliega el código, igual que staging.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Rama, etiqueta o commit a desplegar (tiene que estar en main y con ci en verde)
        type: string
        default: main

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  production:
    # defensa en profundidad: el workflow de un commit que no sea de main ni siquiera arranca
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Revisar que el commit sea de main y que ci haya pasado
        env:
          REF: ${{ inputs.ref }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha=$(git rev-parse HEAD)
          echo "Commit a desplegar: $sha (ref: $REF)"
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error title=Commit fuera de main::$sha no está en main. Producción solo despliega commits de main."
            exit 1
          fi
          passed=$(gh run list --workflow ci.yml --commit "$sha" --json conclusion \
            --jq '[.[] | select(.conclusion == "success")] | length')
          # falla cerrado: si `gh` no devolvió nada, no hay prueba de que ci pasó
          if ! [ "${passed:-0}" -ge 1 ]; then
            echo "::error title=ci sin pasar::ci no terminó en verde en $sha. Espera a que pase (o corrígelo) y vuelve a lanzar."
            exit 1
          fi
          echo "$sha está en main y ci pasó."
      - name: Revisar que producción esté configurada
        run: |
          ready=$(node scripts/ci/hyperdrive-ready.mjs production)
          if [ "$ready" != "ready=true" ]; then
            echo "::error title=Producción sin configurar::wrangler.jsonc aún tiene pendiente el id de Hyperdrive de producción (env.production.hyperdrive). Isaac lo crea, lo pone en el archivo y lo sube a main antes del primer deploy."
            exit 1
          fi
      - name: Revisar los secretos de GitHub
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          for name in PRODUCTION_DATABASE_URL CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=Faltan secretos::Sin valor:$missing. PRODUCTION_DATABASE_URL vive solo en los Environments production y backup (Settings > Environments), nunca como secreto del repositorio. Los de Cloudflare van en el Environment production o en los secretos del repositorio."
            exit 1
          fi
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Aplicar migraciones en producción
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      - name: Desplegar pulso-api
        run: pnpm exec wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Comprobar que producción responde y sirve el contrato del repo
        run: |
          # /health hace un SELECT 1: comprueba el Worker, Hyperdrive y la base. Un despliegue
          # nuevo puede tardar unos segundos en responder, de ahí los reintentos.
          base="https://pulso-api.isaac-mendozasa.workers.dev"
          healthy=false
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 20 "$base/health"; then
              echo
              healthy=true
              break
            fi
            if [ "$attempt" -lt 5 ]; then sleep 5; fi
          done
          if [ "$healthy" != "true" ]; then
            echo "::error title=Producción no responde::$base/health no respondió 200. Para volver atrás: pnpm exec wrangler rollback --env production"
            exit 1
          fi
          # lo servido tiene que ser, byte a byte, el openapi.json del commit desplegado (A-040)
          url="$base/openapi.json"
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 20 "$url" -o served-openapi.json && cmp -s served-openapi.json openapi.json; then
              echo "producción sirve el openapi.json del repo."
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then sleep 5; fi
          done
          echo "::error title=Contrato distinto::$url no es igual al openapi.json del repo. Compara a mano: curl -fsS $url | diff - openapi.json"
          diff served-openapi.json openapi.json | head -40 || true
          exit 1

      - name: Comprobar que TOKEN_SIGNING_KEY está cargado
        run: |
          # un token bien formado pero inválido (43 + "." + 43 caracteres base64url) tiene que dar
          # 401 sin tocar la base; un 500 es que el Worker no tiene TOKEN_SIGNING_KEY.
          base="https://pulso-api.isaac-mendozasa.workers.dev"
          a43=$(printf 'A%.0s' $(seq 1 43))
          code=000
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $a43.$a43" "$base/v1/homes/me/status" || echo 000)
            if [ "$code" = "401" ] || [ "$code" = "500" ]; then break; fi
            if [ "$attempt" -lt 5 ]; then sleep 5; fi
          done
          if [ "$code" != "401" ]; then
            echo "::error title=TOKEN_SIGNING_KEY sin cargar o Worker caído::$base/v1/homes/me/status con un token inválido respondió $code en vez de 401. Un 500 indica que falta el secreto: pnpm exec wrangler secret put TOKEN_SIGNING_KEY --env production"
            exit 1
          fi
          echo "El Worker rechaza un token inválido con 401: TOKEN_SIGNING_KEY está cargado."
